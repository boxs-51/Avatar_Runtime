name: M2-B Private D3D11 2D Pixels (no G03 promotion)
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/rendering/d3d11_scene2d.*'
      - 'src/graphics/d3d11/state_scope.*'
      - 'tests/rendering/d3d11_scene2d_pixels.cpp'
      - 'docs/reference/M2_B_PIXEL_CONTRACT.md'
      - 'docs/completed/audits/M2_B*'
      - 'docs/reference/audits/M2_B*'
      - '.github/workflows/m2-2d-pixels.yml'
permissions:
  contents: read
jobs:
  windows-warp:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Build and read back private 2D pixels
        shell: pwsh
        run: |
          cmake -S . -B build/m2-b -A x64 -DARS_BUILD_D3D11_SPIKE=ON -DARS_BUILD_ASSET_VALIDATOR=ON -DARS_ASSET_FETCH_DEPS=ON -DARS_BUILD_M2_2D_REFERENCE=ON -DARS_BUILD_M2_D3D11_2D=ON
          cmake --build build/m2-b --config RelWithDebInfo --target ars_m2_2d_pixels ars_m2_2d_tests --parallel 2
          ctest --test-dir build/m2-b -C RelWithDebInfo -R '^m2_.*2d_.*$' --output-on-failure
  linux-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reject private D3D11 build on Linux
        run: |
          if cmake -S . -B build/m2-b-guard -DARS_BUILD_M2_D3D11_2D=ON; then
            echo 'M2-B Windows-only guard was bypassed'
            exit 1
          fi
