name: M2-D Private Dual Mode (no G05 promotion)
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/rendering/d3d11_dual_mode_host.*'
      - 'src/rendering/d3d11_scene2d.*'
      - 'src/rendering/d3d11_scene3d.*'
      - 'tests/rendering/d3d11_dual_mode_pixels.cpp'
      - 'tests/gpu/d3d11_live_capture.cpp'
      - 'docs/completed/audits/M2_D*'
      - 'docs/reference/audits/M2_D*'
      - '.github/workflows/m2-dual-mode.yml'
permissions:
  contents: read
jobs:
  windows-warp:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Build and read back private dual-mode pixels
        shell: pwsh
        run: |
          cmake -S . -B build/m2-d -A x64 -DARS_BUILD_D3D11_SPIKE=ON -DARS_BUILD_ASSET_VALIDATOR=ON -DARS_ASSET_FETCH_DEPS=ON -DARS_BUILD_M2_2D_REFERENCE=ON -DARS_BUILD_M2_D3D11_2D=ON -DARS_BUILD_M2_3D_REFERENCE=ON -DARS_BUILD_M2_D3D11_3D=ON -DARS_BUILD_M2_D3D11_DUAL=ON
          cmake --build build/m2-d --config RelWithDebInfo --target ars_m2_dual_pixels ars_m2_2d_pixels ars_m2_3d_pixels --parallel 2
          ctest --test-dir build/m2-d -C RelWithDebInfo -R '^m2_warp_(2d_pixels|3d_pixels|dual_mode)$' --output-on-failure
  linux-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reject Windows-only M2-D build
        run: |
          if cmake -S . -B build/m2-d-guard -DARS_BUILD_M2_D3D11_DUAL=ON; then
            echo 'M2-D Windows-only guard was bypassed'
            exit 1
          fi
