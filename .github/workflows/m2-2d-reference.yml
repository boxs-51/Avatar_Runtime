name: M2-A Private 2D Scene (no G03 promotion)
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/rendering/**'
      - 'tests/rendering/**'
      - 'docs/in-progress/M2_RENDERING_EXECUTION_PLAN.md'
      - 'docs/completed/audits/M2_A*'
      - 'docs/reference/audits/M2_A*'
      - '.github/workflows/m2-2d-reference.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Build and exercise private validated-model draw preparation
        run: |
          cmake -S . -B build/m2-a -DCMAKE_BUILD_TYPE=RelWithDebInfo -DARS_BUILD_ASSET_VALIDATOR=ON -DARS_ASSET_FETCH_DEPS=ON -DARS_BUILD_M2_2D_REFERENCE=ON
          cmake --build build/m2-a --target ars_m2_2d_tests --parallel 2
          ctest --test-dir build/m2-a -R '^m2_private_2d_scene$' --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Build and exercise private validated-model draw preparation
        shell: pwsh
        run: |
          cmake -S . -B build/m2-a -A x64 -DARS_BUILD_ASSET_VALIDATOR=ON -DARS_ASSET_FETCH_DEPS=ON -DARS_BUILD_M2_2D_REFERENCE=ON
          cmake --build build/m2-a --config RelWithDebInfo --target ars_m2_2d_tests --parallel 2
          ctest --test-dir build/m2-a -C RelWithDebInfo -R '^m2_private_2d_scene$' --output-on-failure
