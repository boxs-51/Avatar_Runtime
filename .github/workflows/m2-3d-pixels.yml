name: M2-C Private GLB 3D Pixels (no G04 promotion)
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/rendering/scene3d.*'
      - 'src/rendering/d3d11_scene3d.*'
      - 'src/graphics/backend.hpp'
      - 'src/graphics/d3d11/state_scope.*'
      - 'tests/rendering/scene3d_tests.cpp'
      - 'tests/rendering/d3d11_scene3d_pixels.cpp'
      - 'tests/assets/fixtures/generate_fixtures.py'
      - 'tests/assets/fixtures/manifest.json'
      - 'docs/completed/M2_C_GLB_RENDER_DESIGN.md'
      - 'docs/completed/audits/M2_C*'
      - 'docs/reference/audits/M2_C*'
      - '.github/workflows/m2-3d-pixels.yml'
permissions:
  contents: read
jobs:
  windows-warp:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Build and read back private GLB pixels and depth
        shell: pwsh
        run: |
          cmake -S . -B build/m2-c -A x64 -DARS_BUILD_D3D11_SPIKE=ON -DARS_BUILD_ASSET_VALIDATOR=ON -DARS_ASSET_FETCH_DEPS=ON -DARS_BUILD_M2_3D_REFERENCE=ON -DARS_BUILD_M2_D3D11_3D=ON
          cmake --build build/m2-c --config RelWithDebInfo --target ars_m2_3d_pixels ars_m2_3d_tests --parallel 2
          ctest --test-dir build/m2-c -C RelWithDebInfo -R '^m2_.*3d_.*$' --output-on-failure
  linux-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reject private D3D11 3D build on Linux
        run: |
          if cmake -S . -B build/m2-c-guard -DARS_BUILD_M2_D3D11_3D=ON; then
            echo 'M2-C Windows-only guard was bypassed'
            exit 1
          fi
  linux-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Validate CPU pose and camera projection
        run: |
          cmake -S . -B build/m2-c-cpu -DARS_BUILD_ASSET_VALIDATOR=ON -DARS_ASSET_FETCH_DEPS=ON -DARS_BUILD_M2_3D_REFERENCE=ON
          cmake --build build/m2-c-cpu --target ars_m2_3d_tests --parallel 2
          ctest --test-dir build/m2-c-cpu -R '^m2_private_3d_scene$' --output-on-failure
