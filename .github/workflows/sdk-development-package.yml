name: Installed ABI20 development package (feature-off)
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/ars/**'
      - 'src/abi/**'
      - 'src/core/**'
      - 'src/security/**'
      - 'src/motion/**'
      - 'tests/sdk/**'
      - 'scripts/verify_installed_sdk.py'
      - 'docs/reference/SDK_DEVELOPMENT_PACKAGE.md'
      - 'docs/in-progress/ALPHA_59_PUBLIC_ABI_CONTRACT.md'
      - '.github/workflows/sdk-development-package.yml'
permissions:
  contents: read
jobs:
  installed-consumers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, cc: cl, cxx: cl, name: MSVC-x64}
          - {os: ubuntu-24.04, cc: gcc, cxx: g++, name: GCC-x64}
          - {os: ubuntu-24.04, cc: clang, cxx: clang++, name: Clang-x64}
    runs-on: ${{ matrix.os }}
    name: Installed ABI20 ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Build install relocate and verify feature-off SDK
        run: python scripts/verify_installed_sdk.py --work-root build/installed-sdk-ci
