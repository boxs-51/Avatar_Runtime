name: M0 v0.1 PREP-ONLY CMake CTest
on:
  push:
    branches:
      - prep/m0-v0.1-contract-freeze-m1-kickoff
    paths:
      - "CMakeLists.txt"
      - "contracts/**"
      - "include/**"
      - "tests/abi/**"
      - "tests/contracts/**"
      - "docs/G00_SECURITY_87_CASE_INVENTORY.json"
      - "docs/V0_1_CANONICAL_CONTRACT_RC0.md"
      - "docs/M0_V0_1_FREEZE_READINESS.md"
      - "docs/M1_SOURCE_BOOTSTRAP_PLAN.md"
      - "docs/V0_1_PUBLIC_ABI_FREEZE_MAP.md"
      - "docs/V0_1_FORMAT_VALIDATION_FREEZE_MAP.md"
      - "docs/V0_1_CANONICAL_CONTRACT_RC1.md"
      - "docs/M0_CONTRACT_PARENT_PINS.json"
      - "docs/ADR_0001_D3D11_G00_DESIGN_RC1.md"
      - "docs/P0_OWNER_REMEDIATION_V0.*.md"
      - "docs/ADR_P0_SECURITY_R2.md"
      - "docs/SPECIFICATION_V0.1.md"
      - "docs/ACCEPTANCE_GATES_V0.1.md"
      - "schemas/**"
      - "examples/**"
      - ".github/workflows/m0-freeze-prep.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "contracts/**"
      - "include/**"
      - "tests/abi/**"
      - "tests/contracts/**"
      - "docs/G00_SECURITY_87_CASE_INVENTORY.json"
      - "docs/V0_1_CANONICAL_CONTRACT_RC0.md"
      - "docs/M0_V0_1_FREEZE_READINESS.md"
      - "docs/M1_SOURCE_BOOTSTRAP_PLAN.md"
      - "docs/V0_1_PUBLIC_ABI_FREEZE_MAP.md"
      - "docs/V0_1_FORMAT_VALIDATION_FREEZE_MAP.md"
      - "docs/V0_1_CANONICAL_CONTRACT_RC1.md"
      - "docs/M0_CONTRACT_PARENT_PINS.json"
      - "docs/ADR_0001_D3D11_G00_DESIGN_RC1.md"
      - "docs/P0_OWNER_REMEDIATION_V0.*.md"
      - "docs/ADR_P0_SECURITY_R2.md"
      - "docs/SPECIFICATION_V0.1.md"
      - "docs/ACCEPTANCE_GATES_V0.1.md"
      - "schemas/**"
      - "examples/**"
      - ".github/workflows/m0-freeze-prep.yml"

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu 24.04 / GCC or Clang PREP-ONLY
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: GCC
            cc: gcc
            cxx: g++
          - toolchain: Clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # RC1 pins require parent ancestry and complete blob IDs
      - name: CMake configure / compile / test NONPRODUCTION
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          cmake -S . -B build/prep -DCMAKE_BUILD_TYPE=Debug \
            -DARS_PREP_ONLY=ON -DARS_ENABLE_PREP_TESTS=ON
          cmake --build build/prep --parallel
          ctest --test-dir build/prep --output-on-failure
      - name: Consolidated M0 source custody (not merge permission)
        run: python -m unittest discover -s tests/contracts -p test_m0_consolidation.py -v
      - name: RC1 parent SHA / blob pin check
        shell: bash
        run: python3 tests/contracts/check_m0_rc1_pins.py
      - name: RC1 Draft 2020-12 schema & semantic design tests
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.23.0
          python3 -m unittest discover -s tests/contracts -p 'test_m0_rc1_schema.py' -v
          python3 -m unittest discover -s tests/contracts -p 'test_m0_profile_b_contract.py' -v
          python3 tests/contracts/g00_stage_gate_contract.py
          python3 -m unittest discover -s tests/contracts -p 'test_g00_security_inventory.py' -v
          python3 -m unittest discover -s tests/contracts -p 'test_g00_final_guards.py' -v
          python3 -m unittest discover -s tests/contracts -p 'test_g00_canonical_spec.py' -v

  windows:
    name: Windows 2022 / MSVC x64 PREP-ONLY
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # RC1 pins require parent ancestry and complete blob IDs
      - name: CMake configure / compile / test NONPRODUCTION
        shell: pwsh
        run: |
          cmake -S . -B build/prep -G "Visual Studio 17 2022" -A x64 -DARS_PREP_ONLY=ON -DARS_ENABLE_PREP_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/prep --config Debug --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/prep -C Debug --output-on-failure
          exit $LASTEXITCODE
      - name: Consolidated M0 source custody (not merge permission)
        run: python -m unittest discover -s tests/contracts -p test_m0_consolidation.py -v
      - name: RC1 parent SHA / blob pin check
        shell: pwsh
        run: |
          python tests/contracts/check_m0_rc1_pins.py
          exit $LASTEXITCODE
      - name: RC1 Draft 2020-12 schema & semantic design tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.23.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/contracts -p "test_m0_rc1_schema.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/contracts -p "test_m0_profile_b_contract.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/contracts/g00_stage_gate_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/contracts -p "test_g00_security_inventory.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/contracts -p "test_g00_final_guards.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/contracts -p "test_g00_canonical_spec.py" -v
          exit $LASTEXITCODE
